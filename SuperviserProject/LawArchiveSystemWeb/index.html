<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>执法档案管理系统 - 首页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6fa; }
        .layout { display: flex; height: 100vh; }
        .sider { width: 220px; background: #001529; color: #fff; display: flex; flex-direction: column; }
        .sider .logo { height: 64px; line-height: 64px; text-align: center; font-size: 20px; font-weight: bold; background: #002140; }
        .menu { flex: 1; padding-top: 24px; }
        .menu a { display: block; color: #fff; padding: 14px 32px; text-decoration: none; transition: background 0.2s; }
        .menu a:hover, .menu a.active { background: #1890ff; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { height: 64px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; box-shadow: 0 2px 8px #f0f1f2; }
        .header .user { display: flex; align-items: center; }
        .header .avatar { width: 36px; height: 36px; border-radius: 50%; background: #eee; margin-right: 12px; }
        .header .notify { margin-right: 24px; cursor: pointer; }
        .content { flex: 1; padding: 32px; overflow-y: auto; }
        .quick-actions { margin-bottom: 24px; }
        .quick-actions button { margin-right: 16px; padding: 10px 24px; background: #1890ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .quick-actions button:last-child { background: #52c41a; }
        .cards { display: flex; gap: 24px; margin-bottom: 32px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #f0f1f2; padding: 24px; flex: 1; min-width: 220px; }
        .card-title { font-size: 18px; margin-bottom: 12px; color: #333; }
        .card-data { font-size: 32px; font-weight: bold; color: #1890ff; }
        .card-desc { color: #888; margin-top: 8px; }
        .charts { display: flex; gap: 24px; }
        .chart { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #f0f1f2; flex: 1; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .chart-title { font-size: 16px; margin-bottom: 8px; color: #333; }
        .chart-placeholder { color: #bbb; font-size: 14px; }
    </style>
</head>
<body>
<div class="layout">
    <div class="sider">
        <div class="logo">执法档案管理系统</div>
        <div class="menu">
            <a href="#" class="active">首页</a>
            <a href="#">档案管理</a>
            <a href="#">音视频管理</a>
            <a href="#">权限配置</a>
            <a href="#">数据分析</a>
            <a href="#">审计日志</a>
        </div>
    </div>
    <div class="main">
        <div class="header">
            <div style="font-size: 20px; font-weight: bold;">首页</div>
            <div class="user">
                <span class="notify" title="通知">🔔</span>
                <div class="avatar"></div>
                <span>管理员</span>
            </div>
        </div>
        <div class="content">
            <div class="quick-actions">
                <button>批量上传档案</button>
                <button>关联执法音视频</button>
            </div>
            <div class="cards">
                <div class="card">
                    <div class="card-title">案件档案</div>
                    <div class="card-data">1200</div>
                    <div class="card-desc">今日新增：12 | 待归档：30</div>
                </div>
                <div class="card">
                    <div class="card-title">音视频资料</div>
                    <div class="card-data">500</div>
                    <div class="card-desc">总时长：120h | 待合规审查：5</div>
                </div>
            </div>
            <div class="charts">
                <div class="chart">
                    <div class="chart-title">档案上传量/音视频归档率趋势（近30天）</div>
                    <div class="chart-placeholder">[折线图占位]</div>
                </div>
                <div class="chart">
                    <div class="chart-title">各区县案件数量占比</div>
                    <div class="chart-placeholder">[饼图占位]</div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
