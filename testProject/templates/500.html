{% extends "base.html" %}

{% block title %}服务器错误 - 稽核档案管理系统{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 5rem;"></i>
    </div>
    <h1 class="display-1 text-muted">500</h1>
    <h3 class="mb-3">服务器内部错误</h3>
    <p class="text-muted mb-4">抱歉，服务器遇到了一个错误，无法完成您的请求。</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
            <i class="bi bi-house"></i> 返回首页
        </a>
        <button onclick="location.reload()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-clockwise"></i> 刷新页面
        </button>
    </div>
</div>
{% endblock %}
